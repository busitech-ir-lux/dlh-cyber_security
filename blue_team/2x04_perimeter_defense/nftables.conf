# Generated from segmentation_rules.json
# Local zone: INTERNAL

table inet meddefense {

    set zone_dmz {
        type ipv4_addr
        flags interval
        elements = { 10.10.2.0/24 }
    }

    set zone_internal {
        type ipv4_addr
        flags interval
        elements = { 10.10.1.0/24 }
    }

    set zone_mgmt {
        type ipv4_addr
        flags interval
        elements = { 192.168.10.0/24 }
    }

    set zone_meddev {
        type ipv4_addr
        flags interval
        elements = { 10.10.3.0/24 }
    }

    chain input {
        type filter hook input priority 0;
        policy drop;
        ct state established,related accept
        iifname "lo" accept
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 icmpv6 type { echo-request, echo-reply, destination-unreachable, packet-too-big, time-exceeded } accept
        # Administration access to INTERNAL servers
        ip saddr @zone_mgmt tcp dport 22 counter accept
        # Clinical workstations to INTERNAL server hosts
        ip saddr @zone_internal tcp dport 443 counter accept
        # Clinical workstations to INTERNAL database servers
        ip saddr @zone_internal tcp dport 3306 counter accept
        # Named DMZ application hosts to INTERNAL databases
        # SKIPPED: named DMZ host has no src_ip/src_host
        # DICOM imaging to PACS
        ip saddr @zone_meddev tcp dport 4242 counter accept
        # EHR web integration for device display
        ip saddr @zone_meddev tcp dport 443 counter accept
        counter log prefix "MEDDEFENSE INPUT DROP: " drop
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;
        ct state established,related accept
        # Administration access to INTERNAL servers
        ip saddr @zone_mgmt ip daddr @zone_internal tcp dport 22 counter accept
        # Administration access to DMZ servers
        ip saddr @zone_mgmt ip daddr @zone_dmz tcp dport 22 counter accept
        # Named DMZ application hosts to INTERNAL databases
        # SKIPPED: named DMZ application host has no IP
        # DICOM imaging to PACS
        ip saddr @zone_meddev ip daddr @zone_internal tcp dport 4242 counter accept
        # EHR web integration for device display
        ip saddr @zone_meddev ip daddr @zone_internal tcp dport 443 counter accept
        # DNS resolution to MGMT resolver
        ip saddr @zone_dmz ip daddr @zone_mgmt udp dport 53 counter accept
        # DNS resolution to MGMT resolver over tcp/53
        ip saddr @zone_dmz ip daddr @zone_mgmt tcp dport 53 counter accept
        # DNS resolution to MGMT resolver
        ip saddr @zone_internal ip daddr @zone_mgmt udp dport 53 counter accept
        # DNS resolution to MGMT resolver over tcp/53
        ip saddr @zone_internal ip daddr @zone_mgmt tcp dport 53 counter accept
        # DNS resolution to MGMT resolver
        ip saddr @zone_meddev ip daddr @zone_mgmt udp dport 53 counter accept
        # DNS resolution to MGMT resolver over tcp/53
        ip saddr @zone_meddev ip daddr @zone_mgmt tcp dport 53 counter accept
        # Administration access to medical devices
        ip saddr @zone_mgmt ip daddr @zone_meddev tcp dport 22 counter accept
        # DICOM management to medical devices
        ip saddr @zone_mgmt ip daddr @zone_meddev tcp dport 4242 counter accept
        # No flows from DMZ to MEDDEV
        ip saddr @zone_dmz ip daddr @zone_meddev counter log prefix "MEDDEFENSE DENY: " drop
        # No flows from INTERNAL to DMZ
        ip saddr @zone_internal ip daddr @zone_dmz counter log prefix "MEDDEFENSE DENY: " drop
        # No flows from INTERNAL to MEDDEV
        ip saddr @zone_internal ip daddr @zone_meddev counter log prefix "MEDDEFENSE DENY: " drop
        # No flows from MEDDEV to DMZ or public Internet
        ip saddr @zone_meddev ip daddr @zone_dmz counter log prefix "MEDDEFENSE DENY: " drop
        counter log prefix "MEDDEFENSE FORWARD DROP: " drop
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
        ct state established,related accept
        oifname "lo" accept
        # DNS resolution to MGMT resolver
        ip daddr @zone_mgmt udp dport 53 counter accept
        # DNS resolution to MGMT resolver over tcp/53
        ip daddr @zone_mgmt tcp dport 53 counter accept
    }
}
