title: Suspicious Scheduled Task Creation
id: 9b8c1d72-2a6e-4f43-8c3d-7b1900f5a621
status: experimental
description: Detects suspicious Windows scheduled task creation using Event ID 4698 or schtasks.exe with /create.
logsource:
  product: windows
  category: process_creation

detection:
  selection_event:
    event_id: 4698

  selection_schtasks:
    event_id: 1
    process_name|endswith: schtasks.exe
    command_line|contains: /create

  filter_system:
    user|endswith: SYSTEM

  filter_defender:
    parent_process_name|endswith: MsMpEng.exe

  condition: (selection_event or selection_schtasks) and not (filter_system or filter_defender)

falsepositives:
  - Legitimate software installers creating scheduled tasks
  - Approved MedDefense automation and maintenance tasks

level: high

tags:
  - attack.persistence
  - attack.t1053.005
