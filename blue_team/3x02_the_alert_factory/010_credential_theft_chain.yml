title: Multi-Stage Credential Compromise Chain
id: b6e4c37f-3a15-4d9e-8c72-1f650a2b97d4
status: experimental
description: Detects three failed logins from one source, followed by a successful login from a different source, then privileged activity on the same host. This combines brute force, valid account use, and privilege escalation behavior.
logsource:
  category: correlation

detection:
  selection:
    correlation_primitive: credential_compromise_chain

  condition: selection

falsepositives:
  - User changing network location during legitimate authentication
  - Approved administrative troubleshooting

level: critical

tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1078
