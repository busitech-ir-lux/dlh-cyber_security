
    
  
playbook_id: PB-CRED-001
title: Confirmed phishing credential exposure and unauthorized sign-in
owner_role: M.H

applies_to:
  triggers:
    - User reports entering MedDefense credentials on a fake Microsoft login page
    - Azure AD sign-in logs confirm a foreign-IP sign-in to that account within one hour
  indicators:
    - Phishing URL and timestamp from the user or email report
    - Unrecognized IP, location, device, or session in Azure AD sign-in logs
    - Unexpected Epic, VPN, mailbox, or patient-record access using the account

severity_mapping:
  initial: SEV2
  escalate_if:
    - Confirmed broad ePHI exposure or multiple compromised accounts (SEV1)
    - High patient-safety impact or full outage of a clinical service (SEV1)
    - Evidence shows wider lateral movement or clinical disruption; reassess against the severity matrix

immediate_actions:
  - step: "0-2 min: Open an incident ticket; record username, phishing time, foreign IP, alert time, and known affected services. Declare SEV2."
    owner: IR_Commander
    timebox_minutes: 2
  - step: "2-4 min: Page Technical_Lead and Scribe; open incident bridge. Contact user via a trusted channel; instruct them not to use the compromised account."
    owner: IR_Commander
    timebox_minutes: 2
  - step: "4-9 min: Export and preserve the four evidence sets below, recording UTC timestamps and storage locations. Parallelize exports if possible."
    owner: Technical_Lead
    timebox_minutes: 5
  - step: "9-11 min: IR_Commander records decision: reset now (default) or approve brief monitored delay with a named owner, expiry time, and reason."
    owner: IR_Commander
    timebox_minutes: 2
  - step: "11-15 min: If reset approved, execute all five containment steps below; confirm completion or escalate blockers. Notify Legal_Liaison to start ePHI access assessment."
    owner: Technical_Lead
    timebox_minutes: 4

evidence_preservation:
  - artifact: On-prem Active Directory authentication and domain-controller security logs
    method: "Export relevant security events for the affected username and exposure window; retain original timestamps, source hosts, and export files in restricted incident evidence storage."
    before_step: Active Directory password reset
  - artifact: Azure AD sign-in and audit log export
    method: "Export interactive/non-interactive sign-ins, IPs, session identifiers, MFA events, and audit activity for the account and exposure window; save untouched copies with UTC timestamps."
    before_step: Azure AD session revocation
  - artifact: Affected Microsoft 365 mailbox export
    method: "Using approved administrator/eDiscovery access, preserve mailbox content and relevant forwarding/rule settings for the exposure window in restricted evidence storage; record custodian and export time."
    before_step: Active Directory password reset
  - artifact: Recent data access audit export
    method: "Export Epic access audit, relevant LIS access events, and available Microsoft 365 file-access audit records for the account; record queried systems, UTC window, and any unavailable logs."
    before_step: Epic session termination

containment_actions:
  - step: "Reset the affected account password in on-prem Active Directory; force change at next authorized sign-in and verify hybrid sync to Azure AD."
    owner: Technical_Lead
    decision_point: "IR_Commander approval after evidence snapshot; default is immediate reset. If evidence capture is delayed or active misuse continues, contain immediately and document missing evidence."
    trade_off: "Stops reuse of the known password but may end visibility into attacker actions and interrupt legitimate clinical access."
  - step: "Revoke all active Azure AD sign-in sessions/refresh tokens for the affected identity; verify new authentication is required."
    owner: Technical_Lead
    decision_point: "Execute with password reset unless IR_Commander explicitly authorizes a short, controlled monitoring delay."
    trade_off: "Cuts off cloud sessions but loses live-session observation and signs the legitimate user out."
  - step: "Remove suspect Azure MFA methods and reset/re-register the user's MFA device through verified identity proofing; block re-enrollment by the attacker."
    owner: Technical_Lead
    decision_point: "Confirm affected identity with the user by an independent trusted contact method before re-registration."
    trade_off: "Blocks attacker-controlled factors but temporarily prevents the user from authenticating."
  - step: "Revoke active VPN access tokens/sessions for the account and block further VPN access until re-verification."
    owner: Technical_Lead
    decision_point: "Coordinate with Network Engineer; check for active clinical support work before disconnecting."
    trade_off: "Stops remote network access but may interrupt legitimate remote clinical support."
  - step: "Terminate the user's active Epic Hyperspace sessions (epic.meddefense.local) and require clean reauthentication."
    owner: Technical_Lead
    decision_point: "Check for active patient-care workflow with IT Director; if termination risks patient safety, obtain IR_Commander approval for a coordinated clinical handoff, and escalate to CISO if high-impact."
    trade_off: "Limits patient-record access by the attacker but may disrupt a clinician's active charting session."

eradication_actions:
  - "Remove attacker-added mailbox forwarding rules, delegated permissions, and unauthorized OAuth app grants after preserving evidence."
  - "Revoke any remaining application tokens, reset other exposed secrets, and remove unauthorized MFA registrations."
  - "Inspect the user's workstation for malware and persistence using Wazuh (clinical) or Defender for Endpoint (non-clinical); remediate confirmed findings."
  - "Block the phishing URL/domain in approved controls and check for other MedDefense recipients or compromised identities."

recovery_validation:
  - check: "Test AD and Azure AD login using new password and freshly enrolled MFA."
    criterion: "Legitimate user authenticates successfully; old credentials and revoked sessions fail."
  - check: "Review Azure AD and VPN sign-ins after containment."
    criterion: "No successful unauthorized sign-ins or active attacker sessions remain."
  - check: "Verify Epic and mailbox access with the user and IT Director."
    criterion: "Authorized workflows work; unauthorized sessions, rules, and grants are absent."
  - check: "Review Epic, LIS, and Microsoft 365 access during the exposure window."
    criterion: "Scope of accessible ePHI and any actual access/export is documented; unresolved access is handed to Legal_Liaison."

communication_plan:
  - audience: IR_Commander
    trigger: On confirmed unauthorized sign-in and at each major containment decision
    template: ir_internal_status.md
  - audience: Legal_Liaison
    trigger: "Immediately ask: was ePHI accessible to the compromised account during the exposure window, and was it accessed or disclosed?"
    template: hipaa_assessment_notice.md
  - audience: Executive_Sponsor
    trigger: SEV1 escalation, broad ePHI exposure, or patient-safety impact
    template: ir_executive_brief.md
  - audience: Communications_Lead
    trigger: Legal_Liaison determines that patient, regulator, or external notification preparation is required
    template: ir_external_communications_request.md

escalation_triggers:
  - "Immediately raise to SEV1 for confirmed broad ePHI exposure, high patient-safety impact, or full outage; notify Executive_Sponsor."
  - "Notify IR_Commander and Technical_Lead immediately if more identities, systems, VPN sessions, or clinical applications are affected; reassess severity."
  - "Raise SEV2 to SEV1 if no meaningful containment progress within 60 minutes, per IR team escalation thresholds."
  - "Any proposal to monitor an active attacker instead of resetting requires explicit IR_Commander approval, a short documented deadline, continuous observation, and immediate reset upon further misuse or patient/ePHI risk; never delay merely to collect more evidence."

post_incident_tasks:
  - "Deliver incident timeline, preserved exports, evidence custody details, and all reset/approval decisions to the review."
  - "Document ePHI access findings and Legal_Liaison's HIPAA breach-notification assessment and decisions."
  - "Review phishing controls, MFA enrollment protections, detection gaps, and whether the playbook met its 15-minute targets."
  - "Assign owners and deadlines for remediation and test the playbook at the next exercise."


