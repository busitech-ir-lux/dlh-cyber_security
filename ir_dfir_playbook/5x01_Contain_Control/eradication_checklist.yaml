    description: Rotate LIS-WSIDE-01 machine-account password if compromise investigation supports host trust exposure, coordinating with the clinical service owner.
    command_or_action: 'After authorization: Reset-ComputerMachinePassword -Server <approved-domain-controller> -Credential (Get-Credential)'
