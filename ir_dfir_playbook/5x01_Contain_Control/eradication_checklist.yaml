  - id: ERAD-013
    category: krbtgt
    target_host: 'MEDDEFENSE Active Directory domain'
    description: Assess whether a controlled double reset of krbtgt is necessary; do not execute solely because lateral movement or use of valid Kerberos tickets occurred.
    rationale: 'The supplied TGS and network logon events support credential misuse/lateral movement, not confirmed forged tickets, KRBTGT secret theft, or a Golden Ticket. A domain-wide double reset is disruptive and requires evidence of krbtgt compromise or equivalent domain-level ticket-forgery risk plus formal AD/IR approval.'
    command_or_action: 'Conditional only: AD/IR leadership approves Microsoft-supported krbtgt double-reset procedure; reset once, verify full replication and required ticket-lifetime interval, then reset again. Do not run two immediate Set-ADAccountPassword calls.'
    verification_command: 'Review AD replication status (repadmin /replsummary), krbtgt password version/rotation audit, TGT issuance, and authentication errors across domain controllers.'
    expected_verification_result: 'If required, both approved rotations replicate successfully and no unauthorized forged/old TGT authentication remains; otherwise documented decision not to reset.'
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-014
    category: network
    target_host: 'perimeter firewall'
    description: Maintain egress deny rules for original C2 185.220.101.47 and additional 91.234.99.107.
    command_or_action: 'In firewall console, create/confirm two outbound deny policies for destinations 185.220.101.47/32 and 91.234.99.107/32, with rule IDs and change ticket recorded.'
    verification_command: 'Query firewall rule status and SIEM netflow for both destination IPs after enforcement; inspect denied attempts and any permitted flows.'
    expected_verification_result: 'Both denies enabled; zero permitted packets/bytes to either C2 IP during the verified post-change window.'
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-015
    category: network
    target_host: 'quarantine VLAN / internal segmentation'
    description: Maintain isolation of scoped hosts and restrict SMB/remote administration to prevent additional lateral movement while eradication is verified.
    command_or_action: 'Via switch/firewall/EDR console, apply quarantine ACLs for WST-WS-031, WST-WS-017 and LIS-WSIDE-01; allow only approved forensic jumpbox and required management channels.'
    verification_command: 'Confirm switch VLAN assignments and firewall ACLs; test connection from IR jumpbox (allowed) and user VLAN (denied); review internal SMB netflow.'
    expected_verification_result: 'Only approved forensic access works; unapproved east-west traffic is denied; clinical disruption reviewed.'
    status: pending
    executed_at: null
    executed_by: null
